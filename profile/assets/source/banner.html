<!doctype html>
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&family=JetBrains+Mono:wght@500;600&display=block" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1280px; height: 320px; overflow: hidden; }
  body {
    font-family: 'Manrope', sans-serif; color: #1b1c20; position: relative;
    background:
      radial-gradient(circle at 92% 0%, rgba(186, 39, 70, .10), transparent 420px),
      linear-gradient(100deg, #ffffff 0%, #fbfafb 55%, #f7f3f5 100%);
  }
  .dots { position: absolute; inset: 0; background-image: radial-gradient(rgba(27,28,32,.08) 1px, transparent 1px); background-size: 18px 18px; mask-image: linear-gradient(90deg, transparent 0%, #000 45%); }
  .content { position: absolute; left: 64px; top: 50%; transform: translateY(-50%); width: 470px; }
  .brand { display: flex; align-items: center; gap: 12px; font-weight: 800; font-size: 26px; margin-bottom: 16px; }
  .brand img { width: 42px; height: 42px; border-radius: 9px; }
  h1 { font-size: 30px; line-height: 1.18; font-weight: 800; letter-spacing: -.3px; margin-bottom: 12px; }
  h1 span { color: #ba2746; }
  .sub { font-size: 15px; color: #5b6070; margin-bottom: 18px; line-height: 1.45; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip { font-family: 'JetBrains Mono', monospace; font-size: 12px; font-weight: 600; padding: 4px 9px; border-radius: 6px; background: #fff; border: 1px solid #e6e3e6; color: #374151; }
  svg { position: absolute; right: 40px; top: 22px; }
  .n rect { fill: #fff; stroke-width: 1.5; }
  .t { font-family: 'Manrope', sans-serif; font-size: 13px; font-weight: 700; fill: #1b1c20; }
  .s { font-family: 'JetBrains Mono', monospace; font-size: 10px; fill: #6b7280; }
  .m { font-family: 'JetBrains Mono', monospace; font-size: 10.5px; font-weight: 600; }
  .e { stroke: #cfcbd0; stroke-width: 1.6; fill: none; }
  .hot { stroke: #ba2746; stroke-width: 2; fill: none; stroke-dasharray: 5 4; }
</style></head>
<body>
  <div class="dots"></div>
  <div class="content">
    <div class="brand"><img src="favicon.svg" alt="">Merkaly</div>
    <h1>Dropshipping platform for Brazil,<br><span>built as event-driven services</span></h1>
    <div class="sub">Nuxt frontends, NestJS services talking over RabbitMQ, a database per tenant and shared contracts published to npm.</div>
    <div class="chips"><span class="chip">nuxt 4</span><span class="chip">nestjs</span><span class="chip">rabbitmq</span><span class="chip">mongodb</span><span class="chip">auth0</span><span class="chip">railway</span></div>
  </div>
  <svg width="700" height="276" viewBox="0 0 700 276">
    <defs><marker id="a" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#c4c0c6"/></marker>
    <marker id="h" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#ba2746"/></marker></defs>
    <text class="s" x="0" y="14">clients</text><text class="s" x="210" y="14">services</text><text class="s" x="390" y="14">exchange per domain</text><text class="s" x="580" y="14">consumers</text>
    <path class="e" d="M130 58 H206" marker-end="url(#a)"/>
    <path class="hot" d="M130 196 H206" marker-end="url(#h)"/>
    <path class="e" d="M340 58 H386" marker-end="url(#a)"/>
    <path class="hot" d="M340 186 C365 186 362 128 386 126" marker-end="url(#h)"/>
    <path class="hot" d="M340 196 C368 196 362 66 386 64" marker-end="url(#h)"/>
    <path class="hot" d="M340 206 C365 206 362 238 386 238" marker-end="url(#h)"/>
    <path class="e" d="M530 58 H576" marker-end="url(#a)"/>
    <path class="hot" d="M530 126 H576" marker-end="url(#h)"/>
    <path class="e" d="M530 238 H576" marker-end="url(#a)"/>

    <g class="n"><rect x="0" y="34" width="130" height="48" rx="9" stroke="#d6d3d8"/><text class="t" x="14" y="54">www · admin</text><text class="s" x="14" y="70">store · dashboard</text></g>
    <g class="n"><rect x="0" y="172" width="130" height="48" rx="9" stroke="#d6d3d8" stroke-dasharray="4 3"/><text class="t" x="14" y="192">providers</text><text class="s" x="14" y="208">asaas, auth0, ae</text></g>

    <g class="n"><rect x="210" y="34" width="130" height="48" rx="9" stroke="#1d4ed8"/><text class="t" x="224" y="54">api</text><text class="s" x="224" y="70">records, rules</text></g>
    <g class="n"><rect x="210" y="172" width="130" height="48" rx="9" stroke="#d97706" stroke-width="2"/><text class="t" x="224" y="192">webhooks</text><text class="s" x="224" y="208">gate, no exchange</text></g>

    <g class="n"><rect x="390" y="40" width="140" height="36" rx="18" stroke="#7c3aed"/><text class="m" x="404" y="62" fill="#7c3aed">merkaly.api</text></g>
    <g class="n"><rect x="390" y="108" width="140" height="36" rx="18" stroke="#7c3aed"/><text class="m" x="404" y="130" fill="#7c3aed">merkaly.payments</text></g>
    <g class="n"><rect x="390" y="220" width="140" height="36" rx="18" stroke="#7c3aed"/><text class="m" x="404" y="242" fill="#7c3aed">merkaly.auth</text></g>

    <g class="n"><rect x="580" y="40" width="112" height="36" rx="9" stroke="#1d4ed8"/><text class="t" x="594" y="63">api</text></g>
    <g class="n"><rect x="580" y="108" width="112" height="36" rx="9" stroke="#1d4ed8"/><text class="t" x="594" y="131">payments</text></g>
    <g class="n"><rect x="580" y="220" width="112" height="36" rx="9" stroke="#1d4ed8"/><text class="t" x="594" y="243">api</text></g>
  </svg>
</body></html>
